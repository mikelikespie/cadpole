  <path id="body" d="M112.1 24.6A53.7 53.7 0 1 0 66 111.3C73.9 115.1 91 116.2 99 116.9C94.5 110.2 82.4 97.2 67.5 89.7A23.4 23.4 0 1 1 84.5 46.2A17.5 17.5 0 0 0 112.1 24.6Z" fill="#2FBF9F"/>
