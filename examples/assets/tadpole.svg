<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The tadpole mark, filled shapes only, ids added so a script can pick them.
       Same geometry as the logo (site/static/icon.svg) without its tile.
       `mark` is the whole silhouette, the curled body with the paddle in the
