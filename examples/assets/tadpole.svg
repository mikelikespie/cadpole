<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The tadpole mark, filled shapes only, ids added so a script can pick them.
       Same geometry as tadpole_logo.svg (the original logo), minus the pen-tool
       handle strokes and squares. -->
  <g id="tadpole">
    <path id="tail" d="M72 62 C 90 62, 92 88, 106 89 C 115 90, 119 80, 125 75 C 123 86, 117 99, 105 99 C 88 99, 86 80, 68 79 Z" fill="#14967F"/>
    <circle id="body" cx="50" cy="58" r="30" fill="#14967F"/>
  </g>
  <circle id="eye" cx="60" cy="49" r="9.5" fill="#fff"/>
  <circle id="pupil" cx="62.5" cy="49" r="4.8" fill="#0B2E2A"/>
</svg>
