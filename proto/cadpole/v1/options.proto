// Custom protobuf options that turn `service CadpoleOps` (ops.proto) into the
// single definition of every user-facing Cadpole operation.
//
// Nothing reads these at compile time: the front-ends (MCP `tools/list`, the
// HTTP `/api/ops/*` routes and `cadpole op`) read them at *run* time out of the
// embedded descriptor set with `prost-reflect`, so adding an rpc or a field
// changes all three at once. See docs/design.md.
//
// The package is `cadpole` (not `cadpole.v1`) so the options read as `(cadpole.op)`,
// `(cadpole.field)` and `(cadpole.type)` wherever they are applied, including from
// files that will one day live in `cadpole.v2`. Options are metadata *about* the
// schema, so they are not versioned with it.
syntax = "proto3";

package cadpole;

import "google/protobuf/descriptor.proto";

// How one rpc of `cadpole.v1.CadpoleOps` is exposed by the generated front-ends.
//
// Defaults (when the option is absent) are deliberately useful: the CLI name
// is the snake_case rpc name, the operation is assumed to mutate state, it is
// assumed to run without a server, and no response field is an image.
message Operation {
  // Subcommand name for `cadpole op <name>` and the ergonomic alias
  // (`Evaluate` -> "eval"). Empty means snake_case(rpc name).
  string cli_name = 1;

  // True when calling the operation twice with the same input has the same
  // effect as calling it once and it does not change the document or the
  // session. Read-only operations are safe for an assistant to retry and are
  // the ones a UI may call speculatively.
  bool idempotent = 2;

  // True when the operation can only be served by a running `cadpole serve`
  // (it reads or writes session state: the script, selection, messages or
  // events). Front-ends without a `--server` reject these with a clear error
  // instead of silently doing nothing.
  bool needs_session = 3;

  // Name of the response field holding a PNG image, e.g. "png". MCP turns
  // that field into an `image` content block instead of dumping base64 into
  // the text block; `cadpole op` writes it to `--out`. Empty means no image.
  string image_field = 4;

  // Extra names accepted by the CLI and MCP in addition to the rpc name and
  // `cli_name` (kept so renaming an rpc does not break an assistant mid-task).
  repeated string alias = 5;

  // Hide the operation from `tools/list`, `cadpole op --list` and `GET /api/ops`.
  // It still works when called by name. For operations that are not ready.
  bool hidden = 6;
}

// How one field is exposed: on a request, as a CLI flag and in the generated
// JSON Schema; on a response, only `hidden` and `example` mean anything.
message Field {
  // Long flag name without the dashes, e.g. "param" for `param_overrides`.
  // Empty means the field name with underscores turned into dashes.
  string flag = 1;

  // Take this field from the first positional CLI argument instead of a flag
  // (`cadpole op SetScript main.star` rather than `--path main.star`). At most
  // one field of a message may be positional.
  bool positional = 2;

  // A valid value, shown in `--help` and published as `examples` in the JSON
  // Schema so an assistant has something concrete to copy.
  string example = 3;

  // On a *request* field: never ask the caller for it, the front-end fills it
  // in. Used for `document`, which the CLI loads from `--doc` and MCP/HTTP
  // take from the session. Hidden request fields are absent from the JSON
  // Schema and from `--help`.
  //
  // On a *response* field: leave it out of the JSON the generated front-ends
  // print or return. Used for bulk data an assistant should not be made to
  // read -- `RenderResponse.model` is a whole B-rep -- which a typed caller
  // (`cadpole-engine`, the CLI's own verbs) still gets in full.
  bool hidden = 4;

  // Single-character CLI short flag, e.g. "o" for `--out`/`-o`. Empty for none.
  string short = 5;

  // Reject the call when the field is absent, in `cadpole_ops::check_required`,
  // behind every front door -- and surface it as JSON Schema `required` and a
  // clap `.required(true)` besides.
  //
  // proto3 has no required fields, so "absent" is read as "the default", and
  // that reading holds for a string, a `bytes`, a message and an enum, where
  // the default is not a value anybody means. It does not hold for a number
  // whose zero is a real answer -- `AckRequest.cursor` is required and zero is
  // the start of the log -- so numbers are not checked there and need a check
  // of their own. Marking a numeric field `required` when zero is meaningful
  // therefore promises more than it delivers; give it explicit presence
  // (`optional`) instead.
  bool required = 6;
}

// Presentation of a whole message. Only used for the request/response types of
// `CadpoleOps`; the persistence messages carry none of these.
message Type {
  // Human title for the generated JSON Schema, e.g. "Render a document".
  // Empty means the message's leading comment's first line.
  string title = 1;

  // Keep the message out of generated documentation (internal plumbing).
  bool hidden = 2;
}

extend google.protobuf.MethodOptions {
  // `option (cadpole.op) = { cli_name: "eval" idempotent: true };`
  Operation op = 52001;
}

extend google.protobuf.FieldOptions {
  // `string path = 1 [(cadpole.field) = { positional: true }];`
  Field field = 52001;
}

extend google.protobuf.MessageOptions {
  // `option (cadpole.type) = { title: "Render a document" };`
  Type type = 52001;
}
