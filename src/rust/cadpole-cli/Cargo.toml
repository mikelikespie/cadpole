[package]
name = "cadpole-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cadpole: command line for evaluating, exporting and serving Cadpole documents."

[[bin]]
name = "cadpole"
path = "src/main.rs"

[dependencies]
cadpole-core = { path = "../cadpole-core" }
cadpole-engine = { path = "../cadpole-engine" }
cadpole-ops = { path = "../cadpole-ops" }
# HiGHS, as the solver `opt.problem(...).solve()` uses. Native only:
# the CLI is the one binary that links it.
cadpole-opt = { path = "../cadpole-opt" }
cadpole-render-wgpu = { path = "../cadpole-render-wgpu" }
cadpole-proto = { path = "../cadpole-proto" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-stream.workspace = true
rand.workspace = true
chrono.workspace = true
base64.workspace = true
png.workspace = true
ureq.workspace = true
prost-reflect.workspace = true
miniz_oxide.workspace = true
